name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: true

      - name: Run Engine Tests
        run: pnpm --filter cornerstone-engine test

      - name: Typecheck Web Client
        run: pnpm --filter cornerstone-web typecheck

      - name: Build Web Client Bundle
        run: pnpm --filter cornerstone-web build
