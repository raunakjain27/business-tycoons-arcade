<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Business Tycoons & Arcade Party</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text x='50' y='68' font-size='42' font-weight='bold' text-anchor='middle' fill='white'>BT</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text x='50' y='68' font-size='42' font-weight='bold' text-anchor='middle' fill='white'>BT</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Premium midnight space theme */
        --bg-primary: radial-gradient(circle at 50% -10%, #171f38 0%, #0a0e1a 55%, #060810 100%);
        --bg-secondary: #0e1322;
        --bg-card: rgba(18, 24, 40, 0.85);
        --bg-elevated: #161e33;
        --bg-accent: #8b5cf6;
        --bg-accent-hover: #9d7cff;
        
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-medium: rgba(255, 255, 255, 0.12);
        
        --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
        --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        
        /* Board colors - vibrant against dark */
        --color-harbor: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
        --color-oldtown: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        --color-arts: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
        --color-market: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
        --color-greenbelt: linear-gradient(135deg, #22c55e 0%, #4ade80 100%);
        --color-tech: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
        --color-skyline: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
        --color-crown: linear-gradient(135deg, #fbbf24 0%, #fcd34d 100%);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #c7d2fe 0%, #a5b4fc 100%);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a5b4fc 0%, #818cf8 100%);
      }

      button, input, select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        outline: none;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-medium);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      input, select {
        border: 2px solid var(--border-light);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 14px;
        transition: all 0.2s ease;
        outline: none;
      }

      input:focus, select:focus {
        border-color: #818cf8;
        box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
      }

      /* Responsive utilities */
      @media (max-width: 768px) {
        body {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
