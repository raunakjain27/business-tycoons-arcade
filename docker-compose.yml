services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    ports:
      - "2567:2567"
    environment:
      - PORT=2567
      - CORS_ORIGIN=*
      - JWT_SECRET=change-this-in-production-secret-key-32chars
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - REDIS_URL=redis://default:token@host:6379
