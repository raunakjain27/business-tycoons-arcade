services:
  # Colyseus Real-Time WebSocket Game Server (100% Free on Render)
  - type: web
    name: tycoons-arcade-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --prod=false --no-frozen-lockfile
    startCommand: ./node_modules/.bin/tsx packages/server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
